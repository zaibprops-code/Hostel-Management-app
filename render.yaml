# Render Blueprint — deploys the WHOLE app (API + website) as ONE free service.
# In Render: New + → Blueprint → pick this repo. You'll be asked to paste a few
# values (marked "sync: false" below); everything else is set automatically.
#
# Database  : Supabase Postgres (free) — paste DATABASE_URL when prompted.
# Files     : Cloudflare R2 (free, private) — paste the four R2_* values.
# See SETUP.md for the 15-minute, copy-paste setup.

services:
  # ---- One service: Express API + the built React website ----------------
  - type: web
    name: hostel-app
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    # Install everything (incl. build tools), generate the Prisma client, then
    # compile the server AND build the website. Render handles npm workspaces
    # correctly, so the whole monorepo installs in one step.
    buildCommand: >-
      npm install --include=dev &&
      npm --workspace server run db:generate &&
      npm --workspace server run build &&
      npm --workspace web run build
    # Apply pending Prisma migrations (creates all tables on a fresh database;
    # idempotent and NON-destructive — no --accept-data-loss), then start.
    startCommand: npm --workspace server run db:deploy && npm --workspace server run start
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Postgres connection string. Use the "Session pooler" string
      # (port 5432) from Supabase → Connect → ORMs/Session. Paste it in the
      # Render dashboard (or when the Blueprint prompts you).
      - key: DATABASE_URL
        sync: false
      # Auth secrets — generated once, kept private, never in git.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # API and website are the SAME origin now, so CORS isn't needed for the
      # web app. "*" is kept so the optional native mobile app can also connect.
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "10"
      # Private, invite-only app: no public self-sign-up. Only the owner adds
      # users. (Set "true" only to run this as multi-tenant SaaS.)
      - key: ALLOW_SIGNUP
        value: "false"
      # ---- Cloudflare R2 file storage (private bucket) -------------------
      # Paste these four from your Cloudflare R2 setup (see R2_SETUP.md). With
      # all four set, uploads go to the private R2 bucket and are served only
      # through the authenticated, per-file-authorized /files/r2/<key> route.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # ---- Password-reset email (optional) -------------------------------
      # Fill these only if you want password-reset emails. Leave blank to skip.
      - key: WEB_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
